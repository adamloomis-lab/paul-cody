  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detection. This hidden static form lets Netlify's build bot
      discover the form at build time (required for SPAs where the real React
      form only exists at runtime). The React form on /contact POSTs to "/" with
      a matching form-name. Notification email is set on the Netlify site.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="inquiryType" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
    <!-- Simply Visible analytics --><script src="https://simplyvisible.online/track.js" defer></script>
  </body>
